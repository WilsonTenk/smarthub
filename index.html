<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART HUB GH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              display: ['Anton', 'sans-serif'], // Anton is the Impact-style font
            },
            colors: {
              brand: {
                blue: '#0055FF',      /* Vibrant Blue */
                navy: '#0B1121',      /* Deep Background Blue */
                green: '#00D26A',     /* Subtle Green Accent */
                light: '#F0F4FF',     /* Very Light Blue */
                dark: '#020617'       /* Almost Black Blue */
              }
            },
            animation: {
              'float-slow': 'float 8s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'marquee': 'marquee 60s linear infinite', /* Slowed down from 25s */
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
        background-color: #F0F4FF;
      }
      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Anton', sans-serif;
        letter-spacing: 0.05em; /* Slight spacing for Impact look */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0B1121;
      }
      ::-webkit-scrollbar-thumb {
        background: #0055FF;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00D26A;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6"
  }
}
</script>
